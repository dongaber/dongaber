name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *" # каждый день в 03:00 UTC
  workflow_dispatch: # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=dongaber&show_icons=true&hide_title=true&hide_rank=false&hide=issues,contribs&include_all_commits=true&count_private=true&bg_color=1B1E2B&text_color=A6ACCD&icon_color=C792EA&ring_color=C792EA&border_color=2B2F40&border_radius=8
          path: profile/stats.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=dongaber&layout=compact&hide_title=true&langs_count=6&bg_color=1B1E2B&text_color=A6ACCD&border_color=2B2F40&border_radius=8
          path: profile/top-langs.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
